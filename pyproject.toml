[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filtering"
version = "0.1.0"
description = "Closed-loop CosyVoice3 TTS + Whisper ASR CER filtering and seed-retry system"
requires-python = ">=3.10"
dependencies = [
    "jiwer",
    "torch",
    "torchaudio",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
